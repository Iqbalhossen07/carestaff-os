version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: carestaff_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carestaff_os
      MYSQL_USER: carestaff_user
      MYSQL_PASSWORD: carestaff_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: carestaff_pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:
