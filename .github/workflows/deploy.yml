name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd htdocs/carestaff.iqbalhossen.xyz
            
            # Check if git is initialized
            if [ ! -d ".git" ]; then
              rm -rf * # Clear default CloudPanel files
              git init
              git remote add origin https://github.com/Iqbalhossen07/carestaff-os.git
              git fetch
              git checkout -t origin/main -f
            else
              git reset --hard HEAD
              git pull origin main
            fi
            
            npm install
            npx prisma generate
            npx prisma db push --accept-data-loss
            node --experimental-transform-types prisma/seed.ts || npx ts-node prisma/seed.ts || true
            npm run build
            
            # Restart via pm2 if running, else start
            pm2 restart carestaff-os || pm2 start npm --name "carestaff-os" -- run start -- --port 3110
